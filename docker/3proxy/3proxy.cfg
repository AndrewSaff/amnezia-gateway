# Minimal secure default 3proxy config for amnezia-gateway
nserver 1.1.1.1
nserver 8.8.8.8
nscache 65536

timeouts 1 5 30 60 180 1800 15 60
maxconn 512

auth iponly

# RFC1918 LAN only
allow * 192.168.0.0/16
allow * 172.16.0.0/12
allow * 10.0.0.0/8
deny *

log /dev/stdout
socks -n -p1080
proxy -n -p8080
